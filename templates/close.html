{% extends "base.html" %}
{% block title %}整改销号{% endblock %}
{% block content %}
<header class="header">
  <a class="back" href="{{ url_for('detail', rid=r.id) }}">← 返回</a>
  <div class="row gap title-row"><img class="logo-sm" src="{{ url_for('static', filename='img/logo.png') }}" alt="城管"><h1 class="title">整改销号</h1></div>
</header>
<form method="post" enctype="multipart/form-data" class="form" data-draft="1">
  <label>处理结果
    <textarea name="result" class="input textarea" rows="4"
              placeholder="如：已拆除违建围栏，恢复公共区域" required></textarea>
  </label>
  <div id="result-phrases" class="tpl-row"></div>
  <label>销号日期（默认今天；隔天才销号就改成实际那天）
    <input type="date" name="closed_at" class="input" value="{{ today }}">
  </label>
  <label>整改期限（可选，整改到位日期）
    <input type="date" name="deadline" class="input" value="{{ r.deadline }}">
    <button type="button" class="tpl-btn" onclick="syncDeadline()">同销号日期</button>
  </label>
  <label>整改后照片（可多张）
    <input type="file" name="photos" accept="image/*" multiple capture="environment"
           class="input file" id="photo-input">
    <div class="photo-preview-row" id="photo-preview"></div>
    <span class="muted small" id="photo-hint">未选择照片</span>
    <p class="muted small">电脑端：微信里复制图片，聚焦本页按 Ctrl+V 直接贴进来</p>
  </label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="btn btn-success" type="submit">确认销号</button>
  <p class="muted small center">弱网提交失败会自动暂存本机，恢复网络后补传</p>
</form>
<script>
const PHRASES = {{ phrases | tojson }};
const resTa = document.querySelector('textarea[name=result]');
const box = document.getElementById('result-phrases');
box.innerHTML = '<span class="tpl-hint">常用（点一下填入，还能再改）：</span>';
PHRASES.forEach(function(p) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tpl-btn'; b.textContent = p;
  b.onclick = function() { resTa.value = p; };
  box.appendChild(b);
});
function syncDeadline() {
  const c = document.querySelector('input[name=closed_at]');
  const d = document.querySelector('input[name=deadline]');
  if (c && c.value) d.value = c.value;
}
</script>
{% endblock %}
