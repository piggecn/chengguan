{% extends "base.html" %}
{% block title %}编辑案件{% endblock %}
{% block content %}
<header class="header">
  <a class="back" href="{{ url_for('cases') }}">← 返回</a>
  <div class="row gap title-row"><img class="logo-sm" src="{{ url_for('static', filename='img/logo.png') }}" alt="城管"><h1 class="title">编辑案件</h1></div>
</header>
<form method="post" class="card form tight">
  <label>所属中队
    {% if user.role in ('super', 'office') %}
    <select name="team" class="input" required>
      {% for t in teams %}
      <option value="{{ t }}" {% if c.team == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    {% else %}
    <span class="input readonly">{{ c.team }}</span>
    {% endif %}
  </label>
  <label>案件编号（可选）
    <input name="case_no" class="input" value="{{ c.case_no }}"
           placeholder="如：鄱城立字〔2026〕第001号">
  </label>
  <label>案件名称
    <input name="case_name" class="input" value="{{ c.case_name }}" required>
  </label>
  <label>罚款金额（元）
    <input name="fine_amount" class="input" type="number" min="0" step="0.01" value="{{ c.fine_amount }}">
  </label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="btn btn-primary" type="submit">保存修改</button>
</form>
{% endblock %}
