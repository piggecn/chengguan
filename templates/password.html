{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<header class="header">
  <a class="back" href="{{ url_for('index') }}">← 返回</a>
  <div class="row gap title-row"><img class="logo-sm" src="{{ url_for('static', filename='img/logo.png') }}" alt="城管"><h1 class="title">修改密码</h1></div>
</header>

{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="banner {{ 'banner-ok' if cat == 'ok' else '' }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<form method="post" class="card form tight">
  <label>当前 4 位密码
    <input name="current" class="input" type="password" inputmode="numeric"
           maxlength="4" pattern="[0-9]{4}" placeholder="请输入当前密码" required>
  </label>
  <label>新密码（4 位数字）
    <input name="new" class="input" type="password" inputmode="numeric"
           maxlength="4" pattern="[0-9]{4}" placeholder="请输入新密码" required>
  </label>
  <label>再输一次新密码
    <input name="confirm" class="input" type="password" inputmode="numeric"
           maxlength="4" pattern="[0-9]{4}" placeholder="再次输入新密码" required>
  </label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="btn btn-primary" type="submit">保存新密码</button>
</form>
{% endblock %}
