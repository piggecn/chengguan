{% extends "base.html" %}
{% block title %}编辑巡查记录{% endblock %}
{% block content %}
<header class="header">
  <a class="back" href="{{ url_for('detail', rid=r.id) }}">← 返回</a>
  <div class="row gap title-row"><img class="logo-sm" src="{{ url_for('static', filename='img/logo.png') }}" alt="城管"><h1 class="title">编辑巡查记录</h1></div>
</header>
<form method="post" enctype="multipart/form-data" class="form">
  <label>所属乡镇
    <select name="town" class="input" required>
      {% for t in towns %}
      <option value="{{ t }}" {% if r.town == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </label>
  <label>小区名称（可不填）
    <input name="community" class="input" list="community-list" value="{{ r.community }}" autocomplete="off">
    <datalist id="community-list"></datalist>
  </label>
  <label>问题分类（点选，可不选，默认“其他”）
    <span class="chip-grid">
      {% for c in categories %}
      <label class="chip">
        <input type="radio" name="category" value="{{ c }}"
               {% if r.category == c %}checked{% endif %}>
        <span>{{ c }}</span>
      </label>
      {% endfor %}
    </span>
  </label>
  <label>问题描述（可不填）
    <textarea name="description" class="input textarea" rows="4">{{ r.description }}</textarea>
  </label>
  <div id="desc-tpl" class="tpl-row"></div>
  <label>发现日期（补录时改成实际巡查那天）
    <input type="date" name="found_at" class="input"
           value="{{ r.found_at or r.created_at[:10] }}">
  </label>
  <label>整改期限（可选）
    <input type="date" name="deadline" class="input" value="{{ r.deadline }}">
    <button type="button" class="tpl-btn" onclick="syncDeadline()">同发现日期</button>
  </label>
  {% if r.status == 'closed' %}
  <label>销号日期（填错了可以在这里改）
    <input type="date" name="closed_at" class="input"
           value="{{ r.closed_at[:10] if r.closed_at else '' }}">
  </label>
  {% endif %}
  <label>牵头部门（可选，留空用台账默认）
    <input name="lead_dept" class="input" list="dept-list" autocomplete="off"
           value="{{ r.lead_dept }}" placeholder="{{ lead_default }}">
    <datalist id="dept-list">
      <option value="{{ lead_default }}"><option value="社区、物业">
      <option value="县城管局"><option value="社区">
      <option value="物业"><option value="大队">
    </datalist>
  </label>
  <label>配合部门（可选，留空用台账默认）
    <input name="assist_dept" class="input" list="dept-list" autocomplete="off"
           value="{{ r.assist_dept }}" placeholder="{{ assist_default }}">
  </label>
  <label>补充现场照片（可多张，当时没拍的在这里补）
    <input type="file" name="photos" accept="image/*" multiple capture="environment"
           class="input file" id="photo-input">
    <div class="photo-preview-row" id="photo-preview"></div>
    <span class="muted small" id="photo-hint">未选择照片</span>
    <p class="muted small">电脑端：微信里复制图片，聚焦本页按 Ctrl+V 直接贴进来</p>
  </label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="btn btn-primary" type="submit">保存修改</button>
</form>
<script>
const TPL = {{ tpl | tojson }};
const descTa = document.querySelector('textarea[name=description]');
const tplBox = document.getElementById('desc-tpl');
function renderTpl() {
  const cat = document.querySelector('input[name=category]:checked');
  const list = (cat && TPL[cat.value]) || [];
  if (!list.length) {
    tplBox.innerHTML = '<span class="tpl-hint">换个分类可切对应描述模板</span>';
    return;
  }
  tplBox.innerHTML = '<span class="tpl-hint">常用（点一下替换描述）：</span>';
  list.forEach(function(t) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tpl-btn'; b.textContent = t;
    b.onclick = function() { descTa.value = t; };
    tplBox.appendChild(b);
  });
}
renderTpl();
document.querySelectorAll('input[name=category]').forEach(function(r) {
  r.addEventListener('change', renderTpl);
});
function syncDeadline() {
  const f = document.querySelector('input[name=found_at]');
  const d = document.querySelector('input[name=deadline]');
  if (f && f.value) d.value = f.value;
}
</script>
{% endblock %}
