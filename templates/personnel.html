{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="center-card">
  <img class="logo-lg" src="{{ url_for('static', filename='img/logo.png') }}" alt="城管">
  <h1 class="brand">社区城管巡查</h1>
  <p class="sub">第一步选单位，第二步选姓名，第三步输 4 位密码</p>
  <form method="post" id="login-form" class="stack" autocomplete="off">
    <select name="unit" id="unit" class="input" required>
      <option value="" disabled selected>① 请选择单位</option>
      {% for u in units %}
      <option value="{{ u }}">{{ u }}</option>
      {% endfor %}
    </select>
    <select name="name" id="name" class="input" required disabled>
      <option value="">② 先选单位</option>
    </select>
    <div class="pin-wrap">
      <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1"
             class="pin-box" aria-label="密码第1位">
      <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1"
             class="pin-box" aria-label="密码第2位">
      <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1"
             class="pin-box" aria-label="密码第3位">
      <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1"
             class="pin-box" aria-label="密码第4位">
      <input type="hidden" name="pin" id="pin">
    </div>
    <p class="muted small center">③ 输入 4 位密码</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button class="btn btn-primary" type="submit">开始使用</button>
  </form>
</div>
<p class="org-note">鄱阳县城市管理综合行政执法大队办公室制</p>
{% endblock %}
