services:
  chengguan:
    build: .
    container_name: chengguan
    ports:
      - "8755:5000"
    environment:
      # 主账号的 4 位密码。不填就是 0000，第一次登录后在「修改密码」页改掉。
      - OWNER_PIN=
      # 会话签名密钥。不填会自动生成并写到 ./data/.secret_key（权限 600）。
      # 填了固定值也行，但换值会让所有人掉登录。
      - SECRET_KEY=
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
